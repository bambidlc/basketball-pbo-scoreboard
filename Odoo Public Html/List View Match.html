<t t-name="website_studio.games">
  <t t-call="website.layout">
    <style>
      .pbo-public {
        --pbo-bg: #fbf7f1;
        --pbo-panel: #ffffff;
        --pbo-panel-soft: #fdf6ec;
        --pbo-panel-softer: #fffaf3;
        --pbo-border: #f0e6d6;
        --pbo-border-strong: #e7d8c0;
        --pbo-ink: #2a2218;
        --pbo-text: #3c3225;
        --pbo-muted: #8c8170;
        --pbo-subtle: #b1a48f;
        --pbo-accent: #f4ab5d;
        --pbo-accent-strong: #de8f3a;
        --pbo-accent-deep: #b86f1d;
        --pbo-accent-soft: #fdecd7;
        --pbo-accent-line: #f4d4a8;
        --pbo-made: #1f9d57;
        --pbo-missed: #e2574b;
        --pbo-shadow: 0 1px 2px rgba(43, 34, 24, 0.05), 0 14px 30px -18px rgba(43, 34, 24, 0.28);
        background: var(--pbo-bg);
        color: var(--pbo-text);
        padding: 26px 0 46px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .pbo-public a {
        color: inherit;
      }

      .pbo-shell {
        max-width: 1160px;
      }

      .pbo-num {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }

      .pbo-kicker {
        color: var(--pbo-accent-deep);
        font-size: 0.74rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .pbo-page-title {
        margin: 4px 0 0;
        color: var(--pbo-ink);
        font-size: clamp(1.9rem, 5vw, 3.4rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .pbo-muted {
        color: var(--pbo-muted);
      }

      .pbo-toolbar {
        margin-top: 20px;
        border: 1px solid var(--pbo-border);
        border-radius: 14px;
        background: var(--pbo-panel);
        box-shadow: var(--pbo-shadow);
        padding: 12px;
      }

      .pbo-toolbar .btn-toolbar {
        gap: 10px;
        align-items: center;
      }

      .pbo-toolbar .input-group {
        border: 1px solid var(--pbo-border-strong);
        border-radius: 999px;
        overflow: hidden;
        background: var(--pbo-panel-soft);
      }

      .pbo-toolbar .form-control,
      .pbo-toolbar .btn {
        border: 0;
        background: transparent;
        color: var(--pbo-ink);
        min-height: 42px;
        font-weight: 700;
      }

      .pbo-toolbar .form-control::placeholder {
        color: var(--pbo-subtle);
      }

      .pbo-toolbar .btn {
        color: var(--pbo-accent-deep);
        font-weight: 900;
      }

      .pbo-status-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 16px;
      }

      .pbo-pillbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--pbo-border-strong);
        border-radius: 999px;
        background: var(--pbo-panel);
        color: var(--pbo-muted);
        font-size: 0.74rem;
        font-weight: 900;
        min-height: 34px;
        padding: 6px 14px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
      }

      .pbo-pillbtn:hover {
        border-color: var(--pbo-accent);
        color: var(--pbo-accent-deep);
      }

      .pbo-pillbtn.is-active {
        background: var(--pbo-accent);
        border-color: var(--pbo-accent);
        color: #fff;
      }

      .pbo-pillbtn .pbo-count {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        opacity: 0.7;
      }

      .pbo-grid {
        margin-top: 18px;
      }

      .pbo-match-card {
        position: relative;
        height: 100%;
        border: 1px solid var(--pbo-border);
        border-radius: 14px;
        background: var(--pbo-panel);
        box-shadow: var(--pbo-shadow);
        padding: 16px;
        overflow: hidden;
        transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
      }

      .pbo-match-card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 4px;
        background: linear-gradient(90deg, var(--pbo-accent), var(--pbo-accent-strong));
        opacity: 0;
        transition: opacity 150ms ease;
      }

      .pbo-match-card:hover {
        border-color: var(--pbo-accent-line);
        transform: translateY(-3px);
        box-shadow: 0 1px 2px rgba(43, 34, 24, 0.05), 0 22px 40px -20px rgba(43, 34, 24, 0.35);
      }

      .pbo-match-card:hover::before {
        opacity: 1;
      }

      .pbo-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .pbo-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        background: var(--pbo-panel-soft);
        border: 1px solid var(--pbo-border-strong);
        color: var(--pbo-muted);
        font-size: 0.68rem;
        font-weight: 900;
        min-height: 26px;
        padding: 4px 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .pbo-status-live {
        background: var(--pbo-accent-soft);
        border-color: var(--pbo-accent-line);
        color: var(--pbo-accent-deep);
      }

      .pbo-status-live::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--pbo-accent-strong);
      }

      .pbo-week {
        color: var(--pbo-subtle);
        font-size: 0.7rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .pbo-match-name {
        margin: 12px 0 0;
        color: var(--pbo-ink);
        font-size: 1.05rem;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }

      .pbo-score-row {
        display: grid;
        gap: 7px;
        margin-top: 14px;
      }

      .pbo-team-line {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--pbo-border);
        border-radius: 10px;
        background: var(--pbo-panel-soft);
        padding: 9px 12px;
      }

      .pbo-team-line-home {
        background: var(--pbo-accent-soft);
        border-color: var(--pbo-accent-line);
      }

      .pbo-team-line.is-winner {
        border-color: var(--pbo-accent);
        box-shadow: inset 0 0 0 1px var(--pbo-accent);
      }

      .pbo-team-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 999px;
        border: 1px solid rgba(43, 34, 24, 0.18);
        vertical-align: 0;
        margin-right: 5px;
      }

      .pbo-team-label {
        color: var(--pbo-muted);
        font-size: 0.62rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .pbo-team-line-home .pbo-team-label {
        color: var(--pbo-accent-deep);
      }

      .pbo-team-name {
        color: var(--pbo-ink);
        font-size: 0.98rem;
        font-weight: 900;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pbo-score {
        color: var(--pbo-ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 1.9rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .pbo-team-line.is-winner .pbo-score {
        color: var(--pbo-accent-strong);
      }

      .pbo-match-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 13px;
        padding-top: 13px;
        border-top: 1px solid var(--pbo-border);
      }

      .pbo-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        background: var(--pbo-panel-softer);
        border: 1px solid var(--pbo-border);
        color: var(--pbo-muted);
        font-size: 0.72rem;
        font-weight: 800;
        padding: 4px 10px;
      }

      .pbo-empty-state {
        margin-top: 18px;
        border: 1px dashed var(--pbo-border-strong);
        border-radius: 12px;
        color: var(--pbo-muted);
        font-size: 0.92rem;
        font-weight: 700;
        padding: 28px;
        text-align: center;
      }

      .pbo-empty-state[hidden] {
        display: none;
      }

      .pbo-col[hidden] {
        display: none;
      }

      @media (max-width: 767.98px) {
        .pbo-public {
          padding: 20px 0 36px;
        }

        .pbo-toolbar .btn-toolbar {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>

    <main class="pbo-public o_website_listing_layout" data-pbo-match-list="1">
      <div class="container pbo-shell">
        <div class="oe_structure oe_new"/>

        <section class="pbo-hero" aria-labelledby="pbo-match-list-title">
          <div class="pbo-kicker">Basketball PBO</div>
          <h1 id="pbo-match-list-title" class="pbo-page-title">Matches</h1>
          <p class="pbo-muted mb-0 mt-2">Live, scheduled, and completed youth games.</p>
        </section>

        <section class="pbo-toolbar" aria-label="Match search">
          <div class="btn-toolbar">
            <form method="get" class="o_searchbar_form s_searchbar_input me-auto flex-grow-1">
              <div role="search" class="input-group">
                <input type="search" name="search" class="search-query form-control oe_search_box" placeholder="Search matches" t-att-value="search" autocomplete="off"/>
                <button type="submit" aria-label="Search matches" title="Search" class="btn oe_search_button">
                  <i class="oi oi-search"/>
                  <span t-if="search" class="oe_search_found ms-1">
                    <small>(<t t-out="search_count or 0"/> found)</small>
                  </span>
                </button>
              </div>
              <input name="order" type="hidden" class="o_search_order_by" t-att-value="order_by if order_by else 'x_studio_datetime desc'"/>
            </form>
            <t t-call="website_studio.listing_layout_switcher"/>
          </div>
        </section>

        <section class="pbo-status-filter" aria-label="Filter by status" data-pbo-status-filter="1">
          <button type="button" class="pbo-pillbtn is-active" data-pbo-status="all" aria-pressed="true">
            All <span class="pbo-count" data-pbo-status-count="all">0</span>
          </button>
        </section>

        <section t-attf-class="row g-3 pbo-grid #{'o_website_grid' if layout_mode == 'grid' else 'o_website_list'}" aria-label="Match results" data-pbo-card-grid="1">
          <t t-set="pbo_palette" t-value="{'negro':'#000000','gris charcoal':'#3F4A4C','gris platiado':'#677378','gris claro':'#9BA9B1','blanco':'#FEFEFE','verde oscuro':'#00471D','verde boston':'#039132','teal':'#0FC099','verde neón':'#A5EA53','verde neon':'#A5EA53','navy':'#2D345A','azul':'#253899','royal':'#103FE7','cyan':'#0090FE','ocean blue':'#198ECE','azul celeste':'#4FD1FD','azul victory':'#90C3E2','azul cielo':'#9AE2FA','marrón':'#471E0B','marron':'#471E0B','rojo':'#EC100D','morado':'#430A75','violeta':'#721D80','cardinal':'#672748','magenta':'#F30781','rosado fucsia':'#F902A2','rosado neón':'#FF1979','rosado neon':'#FF1979','rosado':'#F6A1B4','orange neón':'#E45B01','orange neon':'#E45B01','orange':'#F79D2E','amarillo gold':'#FFCC02','amarillo pollito':'#FFF100','dorado':'#C0AA20','vegas gold':'#D6B568'}"/>
          <t t-foreach="records" t-as="record">
            <t t-set="away_score" t-value="record.x_studio_away_score or 0"/>
            <t t-set="home_score" t-value="record.x_studio_home_score or 0"/>
            <t t-set="away_raw" t-value="(record.x_studio_away_team.x_studio_club_id.x_studio_primary_color or '') if record.x_studio_away_team.x_studio_club_id else ''"/>
            <t t-set="home_raw" t-value="(record.x_studio_home_team.x_studio_club_id.x_studio_primary_color or '') if record.x_studio_home_team.x_studio_club_id else ''"/>
            <t t-set="away_color" t-value="pbo_palette.get(away_raw.strip().lower()) or (away_raw if away_raw.startswith('#') else ('#' + away_raw if away_raw else ''))"/>
            <t t-set="home_color" t-value="pbo_palette.get(home_raw.strip().lower()) or (home_raw if home_raw.startswith('#') else ('#' + home_raw if home_raw else ''))"/>
            <t t-set="away_team" t-value="record.x_studio_away_team"/>
            <t t-set="home_team" t-value="record.x_studio_home_team"/>
            <t t-set="away_label" t-value="((away_team.x_studio_club_id.x_name if away_team.x_studio_club_id else False) or (away_team.display_name or '').split(' - ')[0]) + ((' ' + (away_team.display_name or '').split('Equipo')[-1].strip()) if 'Equipo' in (away_team.display_name or '') else '')"/>
            <t t-set="home_label" t-value="((home_team.x_studio_club_id.x_name if home_team.x_studio_club_id else False) or (home_team.display_name or '').split(' - ')[0]) + ((' ' + (home_team.display_name or '').split('Equipo')[-1].strip()) if 'Equipo' in (home_team.display_name or '') else '')"/>
            <t t-set="away_cat" t-value="(away_team.x_studio_categoria or '').upper()"/>
            <t t-set="away_sex" t-value="away_team.x_studio_sexo or ''"/>
            <t t-set="home_cat" t-value="(home_team.x_studio_categoria or '').upper()"/>
            <t t-set="home_sex" t-value="home_team.x_studio_sexo or ''"/>
            <t t-set="status_raw" t-value="record.x_studio_status or 'Scheduled'"/>
            <t t-set="is_live" t-value="'live' in status_raw.lower()"/>
            <t t-set="has_score" t-value="record.x_studio_status in ['Played', 'Live']"/>
            <div t-attf-class="pbo-col #{'col-xl-4 col-md-6 col-12' if layout_mode == 'grid' else 'col-12'}" t-att-data-status="status_raw">
              <a class="o_website_record text-decoration-none d-block pbo-match-card" t-att-href="record_to_url(record)">
                <div class="pbo-card-top">
                  <span t-attf-class="pbo-status #{'pbo-status-live' if is_live else ''}">
                    <t t-out="status_raw"/>
                  </span>
                  <span t-if="record.x_studio_week" class="pbo-week">Week <span class="pbo-num" t-field="record.x_studio_week"/></span>
                </div>

                <div class="pbo-score-row">
                  <div t-attf-class="pbo-team-line #{'is-winner' if has_score and away_score &gt; home_score else ''}" t-att-style="'border-left:4px solid %s' % away_color if away_color else None">
                    <div class="min-w-0">
                      <div class="pbo-team-label">
                        <span t-if="away_color" class="pbo-team-dot" t-att-style="'background:%s' % away_color"/>Away
                      </div>
                      <div class="pbo-team-name">
                        <t t-out="away_label"/>
                      </div>
                      <div t-if="away_cat or away_sex" class="pbo-team-cat" style="margin-top:2px;font-size:11px;font-weight:600;opacity:.55">
                        <t t-out="away_cat"/><t t-if="away_cat and away_sex"> · </t><t t-out="away_sex"/>
                      </div>
                    </div>
                    <div class="pbo-score">
                      <t t-if="has_score" t-out="away_score"/>
                      <t t-else="">--</t>
                    </div>
                  </div>

                  <div t-attf-class="pbo-team-line pbo-team-line-home #{'is-winner' if has_score and home_score &gt; away_score else ''}" t-att-style="'border-left:4px solid %s' % home_color if home_color else None">
                    <div class="min-w-0">
                      <div class="pbo-team-label">
                        <span t-if="home_color" class="pbo-team-dot" t-att-style="'background:%s' % home_color"/>Home
                      </div>
                      <div class="pbo-team-name">
                        <t t-out="home_label"/>
                      </div>
                      <div t-if="home_cat or home_sex" class="pbo-team-cat" style="margin-top:2px;font-size:11px;font-weight:600;opacity:.55">
                        <t t-out="home_cat"/><t t-if="home_cat and home_sex"> · </t><t t-out="home_sex"/>
                      </div>
                    </div>
                    <div class="pbo-score">
                      <t t-if="has_score" t-out="home_score"/>
                      <t t-else="">--</t>
                    </div>
                  </div>
                </div>

                <div t-if="record.x_studio_datetime or record.x_studio_location" class="pbo-match-meta">
                  <span t-if="record.x_studio_datetime" class="pbo-pill" t-field="record.x_studio_datetime"/>
                  <span t-if="record.x_studio_location" class="pbo-pill" t-field="record.x_studio_location"/>
                </div>
              </a>
            </div>
          </t>
        </section>

        <div class="pbo-empty-state" data-pbo-empty="1" hidden="hidden">No matches match this filter.</div>

        <div class="oe_structure oe_new"/>
        <div t-if="pager" class="o_portal_pager d-flex justify-content-center my-4">
          <t t-call="portal.pager"/>
        </div>
      </div>

      <script>
        <![CDATA[
          (function () {
            var root = document.querySelector("[data-pbo-match-list]");
            if (!root) { return; }
            var filterBar = root.querySelector("[data-pbo-status-filter]");
            var grid = root.querySelector("[data-pbo-card-grid]");
            var emptyState = root.querySelector("[data-pbo-empty]");
            if (!filterBar || !grid) { return; }

            var cards = Array.prototype.slice.call(grid.querySelectorAll(".pbo-col"));
            var counts = { all: cards.length };
            var order = [];

            cards.forEach(function (card) {
              var status = (card.getAttribute("data-status") || "Other").trim();
              card.dataset.statusKey = status;
              if (counts[status] === undefined) { counts[status] = 0; order.push(status); }
              counts[status] += 1;
            });

            var allBtn = filterBar.querySelector('[data-pbo-status="all"]');
            var allCount = allBtn ? allBtn.querySelector('[data-pbo-status-count="all"]') : null;
            if (allCount) { allCount.textContent = counts.all; }

            order.sort(function (a, b) { return a.localeCompare(b); }).forEach(function (status) {
              var button = document.createElement("button");
              button.type = "button";
              button.className = "pbo-pillbtn";
              button.setAttribute("data-pbo-status", status);
              button.setAttribute("aria-pressed", "false");
              button.innerHTML = status + ' <span class="pbo-count">' + counts[status] + "</span>";
              filterBar.appendChild(button);
            });

            function apply(status) {
              var visible = 0;
              cards.forEach(function (card) {
                var show = status === "all" || card.dataset.statusKey === status;
                card.hidden = !show;
                if (show) { visible += 1; }
              });
              Array.prototype.forEach.call(filterBar.querySelectorAll("[data-pbo-status]"), function (button) {
                var on = button.getAttribute("data-pbo-status") === status;
                button.classList.toggle("is-active", on);
                button.setAttribute("aria-pressed", on ? "true" : "false");
              });
              if (emptyState) { emptyState.hidden = visible !== 0; }
            }

            filterBar.addEventListener("click", function (e) {
              var button = e.target.closest("[data-pbo-status]");
              if (button) { apply(button.getAttribute("data-pbo-status")); }
            });
          })();
        ]]>
      </script>
    </main>
  </t>
</t>
